[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Реальный DSN подставляется в alembic/env.py из переменной окружения DATABASE_URL,
# это значение — только заглушка на случай прямого запуска без env.
sqlalchemy.url = postgresql+psycopg2://domradar:domradar@localhost:5432/domradar

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

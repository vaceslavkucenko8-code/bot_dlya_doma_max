services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-domradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domradar}
      POSTGRES_DB: ${POSTGRES_DB:-domradar}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domradar} -d ${POSTGRES_DB:-domradar}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-domradar}:${POSTGRES_PASSWORD:-domradar}@db:5432/${POSTGRES_DB:-domradar}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_API_BASE_URL: ${MAX_API_BASE_URL:-https://botapi.max.ru}
      MAX_API_TIMEOUT_SECONDS: ${MAX_API_TIMEOUT_SECONDS:-5}
      MAX_API_MAX_RETRIES: ${MAX_API_MAX_RETRIES:-3}
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET:-}
      SLA_THRESHOLD_HOURS: ${SLA_THRESHOLD_HOURS:-24}
      SLA_CHECK_INTERVAL_MINUTES: ${SLA_CHECK_INTERVAL_MINUTES:-60}
      PHOTOS_STORAGE_DIR: /data/photos
      PHOTO_MAX_BYTES: ${PHOTO_MAX_BYTES:-10485760}
      PHOTO_ALLOWED_HOSTS: ${PHOTO_ALLOWED_HOSTS:-}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-65536}
      DUPLICATE_MESSAGE_WINDOW_SECONDS: ${DUPLICATE_MESSAGE_WINDOW_SECONDS:-600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - photos_data:/data/photos

volumes:
  db_data:
  photos_data:
